# Unified Base Configuration for GCP Marker Localization & Shape Classification

data:
  annotation_file: "data/raw/gcp_marks.json"
  raw_images_dir: "data/raw/train_dataset"
  processed_dir: "data/processed"
  val_ratio: 0.15
  crop_size: 512
  output_size: 224
  num_pos_aug: 5
  max_offset: 128
  num_neg_samples: 5
  seed: 42

model:
  localizer:
    name: resnet18
    pretrained: true
    dropout: 0.2
    checkpoint: "artifacts/models/best_localizer_model.pt"

  classifier:
    name: resnet18
    pretrained: true
    num_classes: 3
    checkpoint: "models/classifier.pt"

training:
  localizer:
    batch_size: 32
    num_epochs: 30
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_workers: 2
    save_path: "artifacts/models/best_localizer_model.pt"

  classifier:
    batch_size: 32
    num_epochs: 20
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_workers: 2
    save_path: "models/classifier.pt"

inference:
  tile_size: 512
  tile_stride: 128
  model_input_size: 224
  localizer_checkpoint: "models/localizer.pt"
  classifier_checkpoint: "models/classifier.pt"
